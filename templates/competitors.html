{% extends "base.html" %}
{% block content %}
<h1>Competitors</h1>

<form method="post" class="card-form">
  <div class="grid">
    <label>Name <input name="name" required></label>
    <label>Hometown <input name="hometown"></label>
    <label>Sponsor <input name="sponsor"></label>
    <label>Partner (team events) <input name="partner"></label>
    <label>Draw Animal / Stock <input name="draw_animal"></label>
    <label>Notes <input name="notes"></label>
  </div>
  <button type="submit">Add Competitor</button>
</form>

<table class="list">
  <tr><th>Name</th><th>Hometown</th><th>Sponsor</th><th>Partner</th><th>Draw Animal</th><th></th></tr>
  {% for p in people %}
  <tr>
    <td>{{ p.name }}</td>
    <td>{{ p.hometown }}</td>
    <td>{{ p.sponsor }}</td>
    <td>{{ p.partner }}</td>
    <td>{{ p.draw_animal }}</td>
    <td>
      <form method="post" action="{{ url_for('delete_competitor', cid=p.id) }}" onsubmit="return confirm('Delete this competitor and their entries?');">
        <button class="danger" type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
